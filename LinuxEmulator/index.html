<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tiny Core Linux - Live RAM & Heap Reader</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        h2 { margin-bottom: 5px; }
        .control-container { margin-bottom: 15px; text-align: center; }
        button {
            background-color: #d9534f;
            color: #fff;
            border: 1px solid #d43f3a;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 16px;
            border-radius: 4px;
        }
        button:hover { background-color: #c9302c; }
        
        .workspace {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 1400px;
            justify-content: center;
        }

        .left-pane {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #screen_container {
            width: 800px;
            height: 600px;
            background-color: #000;
            border: 2px solid #333;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        canvas { display: block; }

        .right-pane {
            width: 450px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .panel {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            height: 285px;
        }

        .panel h3 {
            margin: 0 0 8px 0;
            font-size: 14px;
            color: #4CAF50;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
        }

        #log-output {
            flex-grow: 1;
            background-color: #0a0a0a;
            color: #00ff66;
            font-family: monospace;
            font-size: 12px;
            padding: 8px;
            overflow-y: auto;
            border-radius: 4px;
            border: 1px solid #222;
            white-space: pre-wrap;
            word-break: break-all;
        }

        #ram-inspector {
            flex-grow: 1;
            background-color: #0a0a0a;
            color: #ccc;
            font-family: monospace;
            font-size: 12px;
            padding: 8px;
            overflow-y: auto;
            border-radius: 4px;
            border: 1px solid #222;
        }

        .ram-row {
            padding: 2px 0;
            border-bottom: 1px solid #1a1a1a;
            display: flex;
            justify-content: space-between;
        }

        #status-display {
            margin-top: 10px;
            font-size: 15px;
            color: #aaa;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>Tiny Core Linux Live RAM Inspector</h2>
    <div class="control-container" id="control_area">
        <button onclick="startTinyCore()" style="background-color: #333; border: 1px solid #555;">Start Emulator & Hook RAM</button>
    </div>

    <div id="status-display">Click to start and read live RAM bytes.</div>

    <div class="workspace">
        <div class="left-pane">
            <div id="screen_container">
                <div id="screen"></div>
            </div>
        </div>

        <div class="right-pane">
            <div class="panel">
                <h3>Inner System & Serial Logs</h3>
                <div id="log-output">System logs will appear here upon boot...</div>
            </div>
            <div class="panel">
                <h3>Live Guest RAM Memory Dump (First 512 Bytes)</h3>
                <div id="ram-inspector">
                    <span style="color: #666;">Awaiting v86 memory initialization...</span>
                </div>
            </div>
        </div>
    </div>

    <script src="libv86.js"></script>
    <script>
        let currentEmulator = null;

        function logToPanel(text) {
            const logBox = document.getElementById("log-output");
            logBox.innerText += text + "\n";
            logBox.scrollTop = logBox.scrollHeight;
        }

        async function startTinyCore() {
            const controlArea = document.getElementById("control_area");
            const statusDisplay = document.getElementById("status-display");
            
            controlArea.innerHTML = `
                <div style="font-weight: bold; color: #4CAF50; margin-bottom: 5px;">
                    System Active: Live Guest RAM Hooked
                </div>
                <button onclick="location.reload()" style="padding: 5px 10px; font-size: 14px;">Stop / Reset</button>
            `;

            const isoUrl = 'https://huggingface.co/datasets/BasicallyDev/VoidLinuxISOS/resolve/main/TinyCore-current.iso';

            try {
                statusDisplay.innerText = "Downloading ISO completely into memory...";
                logToPanel("[Init] Starting fetch request for ISO...");
                
                const response = await fetch(isoUrl);
                if (!response.ok) throw new Error("HTTP error " + response.status);

                const contentLength = response.headers.get('Content-Length');
                const total = contentLength ? parseInt(contentLength, 10) : 0;
                
                const reader = response.body.getReader();
                let receivedLength = 0;
                let chunks = [];

                while(true) {
                    const {done, value} = await reader.read();
                    if (done) break;
                    chunks.push(value);
                    receivedLength += value.length;
                    
                    if (total > 0) {
                        let percent = ((receivedLength / total) * 100).toFixed(1);
                        statusDisplay.innerText = `Downloading: ${percent}% (${(receivedLength / (1024*1024)).toFixed(1)} MB)`;
                    }
                }

                logToPanel(`[Download] Successfully downloaded ${(receivedLength / (1024*1024)).toFixed(1)} MB.`);
                statusDisplay.innerText = "Assembling ArrayBuffer...";

                let isoArrayBuffer = new Uint8Array(receivedLength);
                let position = 0;
                for(let chunk of chunks) {
                    isoArrayBuffer.set(chunk, position);
                    position += chunk.length;
                }

                statusDisplay.innerText = "Booting v86 emulator environment...";
                logToPanel("[v86] Initializing V86 instance with 512MB RAM...");

                currentEmulator = new V86({
                    screen_container: document.getElementById("screen_container"),
                    bios: { url: "bios/seabios.bin" },
                    vga_bios: { url: "bios/vgabios.bin" },
                    cdrom: { 
                        buffer: isoArrayBuffer.buffer 
                    },
                    hda: { 
                        buffer: new ArrayBuffer(1024 * 1024 * 1024) 
                    },
                    wasm_path: "build/v86.wasm",
                    autostart: true,
                    memory: 512 * 1024 * 1024,
                    vga_memory: 128 * 1024 * 1024,
                    cpus: 4,
                    acpi: true,
                    serial_container: document.getElementById("log-output")
                });

                statusDisplay.innerText = "Running GUI & Reading Guest RAM";
                logToPanel("[v86] Emulator started successfully.");

                // Directly read the guest's physical memory using v86's built-in memory mapping API
                setInterval(() => {
                    readGuestRam();
                }, 1000);

            } catch (err) {
                console.error(err);
                statusDisplay.innerText = "Fatal Error: " + err.message;
                logToPanel("[Error] " + err.message);
            }
        }

        function readGuestRam() {
            if (!currentEmulator) return;

            try {
                // v86 exposes a memory reading API via bus or direct memory dump
                // Reading physical address 0x00000000 (first 128 bytes of guest RAM vector table / boot sector)
                const ramBuffer = currentEmulator.read_memory(0, 128);
                if (!ramBuffer) return;

                const view = new Uint8Array(ramBuffer);
                let hexLines = "";
                
                for (let i = 0; i < view.length; i += 16) {
                    let addrHex = i.toString(16).padStart(4, '0');
                    let chunk = Array.from(view.subarray(i, i + 16))
                        .map(b => b.toString(16).padStart(2, '0'))
                        .join(' ');
                    hexLines += `<div class="ram-row"><span>0x${addrHex}:</span> <span style="color:#00ff66;">${chunk}</span></div>`;
                }

                document.getElementById("ram-inspector").innerHTML = hexLines;
            } catch (e) {
                // Ignore transient race conditions during early CPU initialization
            }
        }
    </script>
</body>
</html>
