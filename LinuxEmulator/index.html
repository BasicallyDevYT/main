<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Void Linux School Emulator</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h2 { margin-bottom: 10px; }
        .button-container { margin-bottom: 20px; }
        button {
            background-color: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 10px 20px;
            margin: 0 5px;
            cursor: pointer;
            font-size: 16px;
            border-radius: 4px;
        }
        button:hover { background-color: #444; }
        #screen_container {
            width: 800px;
            height: 600px;
            background-color: #000;
            border: 2px solid #333;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        canvas { display: block; }
        #loading {
            margin-top: 10px;
            font-style: italic;
            color: #aaa;
        }
    </style>
</head>
<body>

    <h2>Void Linux - School Edition</h2>
    <div class="button-container">
        <button onclick="startLinux('base')">Start Base (CLI)</button>
        <button onclick="startLinux('xfce')">Start XFCE (GUI)</button>
    </div>

    <div id="loading"></div>

    <div id="screen_container">
        <div id="screen"></div>
    </div>

    <script src="libv86.js"></script>
    <script>
        let currentEmulator = null;

        async function startLinux(version) {
            if (currentEmulator) {
                currentEmulator.stop();
                currentEmulator = null;
            }

            document.getElementById("screen").innerHTML = "";
            const loadingDiv = document.getElementById("loading");
            loadingDiv.innerText = "Downloading ISO from Hugging Face...";

            const isoUrl = (version === 'xfce') 
                ? 'https://huggingface.co/datasets/BasicallyDev/VoidLinuxISOS/resolve/main/void-live-i686-20250202-xfce.iso' 
                : 'https://huggingface.co/datasets/BasicallyDev/VoidLinuxISOS/resolve/main/void-live-i686-20250202-base.iso';

            try {
                // Public fetch without any auth headers needed
                const response = await fetch(isoUrl);

                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                loadingDiv.innerText = "Processing ISO into memory...";
                const blob = await response.blob();
                const buffer = await blob.arrayBuffer();

                loadingDiv.innerText = "Booting emulator...";

                currentEmulator = new V86({
                    screen_container: document.getElementById("screen_container"),
                    bios: { url: "bios/seabios.bin" },
                    vga_bios: { url: "bios/vgabios.bin" },
                    cdrom: { buffer: buffer },
                    autostart: true,
                    memory: version === 'xfce' ? 512 * 1024 * 1024 : 256 * 1024 * 1024,
                    vga_memory: 16 * 1024 * 1024,
                    network_relay_url: "wss://relay.widget.v86.wasm.in/",
                    boot_order: 0x3
                });

                loadingDiv.innerText = "";
            } catch (err) {
                console.error(err);
                loadingDiv.innerText = "Error loading ISO: " + err.message;
            }
        }
    </script>
</body>
</html>
