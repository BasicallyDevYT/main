<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tiny Core Linux - Interactive Virtual File Explorer</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        h2 { margin-bottom: 5px; }
        .control-container { margin-bottom: 15px; text-align: center; }
        button {
            background-color: #d9534f;
            color: #fff;
            border: 1px solid #d43f3a;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 16px;
            border-radius: 4px;
        }
        button:hover { background-color: #c9302c; }
        
        .workspace {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 1400px;
            justify-content: center;
        }

        .left-pane {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #screen_container {
            width: 800px;
            height: 600px;
            background-color: #000;
            border: 2px solid #333;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        canvas { display: block; }

        .right-pane {
            width: 450px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .panel {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            height: 285px;
        }

        .panel h3 {
            margin: 0 0 8px 0;
            font-size: 14px;
            color: #4CAF50;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
        }

        #log-output {
            flex-grow: 1;
            background-color: #0a0a0a;
            color: #00ff66;
            font-family: monospace;
            font-size: 12px;
            padding: 8px;
            overflow-y: auto;
            border-radius: 4px;
            border: 1px solid #222;
            white-space: pre-wrap;
            word-break: break-all;
        }

        #interactive-explorer {
            flex-grow: 1;
            background-color: #0a0a0a;
            color: #ccc;
            font-family: Arial, sans-serif;
            font-size: 13px;
            padding: 8px;
            overflow-y: auto;
            border-radius: 4px;
            border: 1px solid #222;
        }

        .breadcrumb {
            background-color: #151515;
            padding: 6px 10px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
            color: #3498db;
            margin-bottom: 8px;
            border: 1px solid #222;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .file-list-ui {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .file-row {
            padding: 6px 8px;
            margin: 2px 0;
            background-color: #151515;
            border-radius: 4px;
            border: 1px solid #222;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .file-row:hover {
            background-color: #2a2a2a;
            color: #fff;
            border-color: #444;
        }

        .file-name {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .file-type {
            font-family: monospace;
            font-size: 11px;
            color: #888;
        }

        #status-display {
            margin-top: 10px;
            font-size: 15px;
            color: #aaa;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>Tiny Core Linux Interactive Workspace</h2>
    <div class="control-container" id="control_area">
        <button onclick="startTinyCore()" style="background-color: #333; border: 1px solid #555;">Start Emulator & Clickable Explorer</button>
    </div>

    <div id="status-display">Click to start emulator and navigate directories.</div>

    <div class="workspace">
        <div class="left-pane">
            <div id="screen_container">
                <div id="screen"></div>
            </div>
        </div>

        <div class="right-pane">
            <div class="panel">
                <h3>Inner System & Serial Logs</h3>
                <div id="log-output">System logs will appear here upon boot...</div>
            </div>
            <div class="panel">
                <h3>Interactive File Explorer</h3>
                <div class="breadcrumb">
                    <span id="current-path">Path: /</span>
                    <button onclick="goToParent()" style="padding: 2px 6px; font-size: 11px; background: #333; border: none; color: #fff; border-radius: 3px; cursor: pointer;">⬆ Up</button>
                </div>
                <div id="interactive-explorer">
                    <ul class="file-list-ui" id="file-list-container">
                        <li class="file-row" style="color: #666; cursor: default;"><span>Awaiting system boot...</span></li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script src="libv86.js"></script>
    <script>
        let currentEmulator = null;

        // Simulated fully traversable virtual filesystem structure representing Tiny Core's live memory state
        const virtualFileSystem = {
            "/": {
                type: "dir",
                contents: {
                    "boot": { type: "dir", contents: { 
                        "vmlinuz": { type: "file", size: "4.2 MB", content: "Linux Kernel binary image loaded from CD-ROM." },
                        "core.gz": { type: "file", size: "16.8 MB", content: "Tiny Core root initial RAM disk file system archive." }
                    }},
                    "home": { type: "dir", contents: { 
                        "tc": { type: "dir", contents: { 
                            ".profile": { type: "file", size: "140 B", content: "export PATH=$PATH:/usr/local/bin\n" },
                            ".ashrc": { type: "file", size: "65 B", content: "alias ll='ls -la'\n" }
                        }}
                    }},
                    "etc": { type: "dir", contents: { 
                        "passwd": { type: "file", size: "112 B", content: "root:x:0:0:root:/root:/bin/sh\rtc:x:1001:50:Guest Account:/home/tc:/bin/sh\n" },
                        "resolv.conf": { type: "file", size: "38 B", content: "nameserver 8.8.8.8\n" },
                        "hostname": { type: "file", size: "10 B", content: "tinycore\n" }
                    }},
                    "tmp": { type: "dir", contents: {
                        "tce": { type: "dir", contents: {
                            "optional": { type: "dir", contents: {} }
                        }}
                    }},
                    "mnt": { type: "dir", contents: {
                        "sr0": { type: "dir", contents: {
                            "cde": { type: "dir", contents: {
                                "onboot.lst": { type: "file", size: "24 B", content: "flwm_topside.tcz\nwbar.tcz\n" }
                            }}
                        }}
                    }}
                }
            }
        };

        let currentPathStack = ["/"];

        function getCurrentDirObject() {
            let current = virtualFileSystem["/"];
            for (let i = 1; i < currentPathStack.length; i++) {
                let dirName = currentPathStack[i];
                if (current.contents && current.contents[dirName]) {
                    current = current.contents[dirName];
                }
            }
            return current;
        }

        function renderExplorer() {
            const container = document.getElementById("file-list-container");
            const pathSpan = document.getElementById("current-path");
            
            let fullPathStr = "/" + currentPathStack.slice(1).join("/");
            pathSpan.innerText = "Path: " + fullPathStr;

            let dirObj = getCurrentDirObject();
            if (!dirObj || !dirObj.contents) {
                container.innerHTML = `<li class="file-row" style="color: #888;"><span>Empty directory</span></li>`;
                return;
            }

            let html = "";
            for (let [name, item] of Object.entries(dirObj.contents)) {
                if (item.type === "dir") {
                    html += `
                        <li class="file-row" onclick="enterDirectory('${name}')">
                            <span class="file-name">📁 <b>${name}/</b></span>
                            <span class="file-type">[Directory]</span>
                        </li>
                    `;
                } else {
                    html += `
                        <li class="file-row" onclick="viewFileContent('${name}', '${item.size}', '${btoa(item.content)}')">
                            <span class="file-name">📄 ${name}</span>
                            <span class="file-type">${item.size}</span>
                        </li>
                    `;
                }
            }
            container.innerHTML = html;
        }

        function enterDirectory(dirName) {
            currentPathStack.push(dirName);
            renderExplorer();
        }

        function goToParent() {
            if (currentPathStack.length > 1) {
                currentPathStack.pop();
                renderExplorer();
            }
        }

        function viewFileContent(fileName, size, base64Content) {
            let decoded = atob(base64Content);
            alert(`File: ${fileName} (${size})\n-----------------------------------\n\n` + decoded);
        }

        function logToPanel(text) {
            const logBox = document.getElementById("log-output");
            logBox.innerText += text + "\n";
            logBox.scrollTop = logBox.scrollHeight;
        }

        async function startTinyCore() {
            const controlArea = document.getElementById("control_area");
            const statusDisplay = document.getElementById("status-display");
            
            controlArea.innerHTML = `
                <div style="font-weight: bold; color: #4CAF50; margin-bottom: 5px;">
                    System Active: Clickable File Browser Ready
                </div>
                <button onclick="location.reload()" style="padding: 5px 10px; font-size: 14px;">Stop / Reset</button>
            `;

            const isoUrl = 'https://huggingface.co/datasets/BasicallyDev/VoidLinuxISOS/resolve/main/TinyCore-current.iso';

            try {
                statusDisplay.innerText = "Downloading ISO completely into memory...";
                logToPanel("[Init] Starting fetch request for ISO...");
                
                const response = await fetch(isoUrl);
                if (!response.ok) throw new Error("HTTP error " + response.status);

                const contentLength = response.headers.get('Content-Length');
                const total = contentLength ? parseInt(contentLength, 10) : 0;
                
                const reader = response.body.getReader();
                let receivedLength = 0;
                let chunks = [];

                while(true) {
                    const {done, value} = await reader.read();
                    if (done) break;
                    chunks.push(value);
                    receivedLength += value.length;
                    
                    if (total > 0) {
                        let percent = ((receivedLength / total) * 100).toFixed(1);
                        statusDisplay.innerText = `Downloading: ${percent}% (${(receivedLength / (1024*1024)).toFixed(1)} MB)`;
                    }
                }

                logToPanel(`[Download] Successfully downloaded ${(receivedLength / (1024*1024)).toFixed(1)} MB.`);
                statusDisplay.innerText = "Assembling ArrayBuffer...";

                let isoArrayBuffer = new Uint8Array(receivedLength);
                let position = 0;
                for(let chunk of chunks) {
                    isoArrayBuffer.set(chunk, position);
                    position += chunk.length;
                }

                statusDisplay.innerText = "Booting v86 emulator environment...";
                logToPanel("[v86] Initializing V86 instance with 512MB RAM...");

                currentEmulator = new V86({
                    screen_container: document.getElementById("screen_container"),
                    bios: { url: "bios/seabios.bin" },
                    vga_bios: { url: "bios/vgabios.bin" },
                    cdrom: { 
                        buffer: isoArrayBuffer.buffer 
                    },
                    hda: { 
                        buffer: new ArrayBuffer(1024 * 1024 * 1024) 
                    },
                    wasm_path: "build/v86.wasm",
                    autostart: true,
                    memory: 512 * 1024 * 1024,
                    vga_memory: 128 * 1024 * 1024,
                    cpus: 4,
                    acpi: true,
                    serial_container: document.getElementById("log-output")
                });

                statusDisplay.innerText = "Running GUI & Interactive Workspace";
                logToPanel("[v86] Emulator started successfully.");
                
                // Populate the interactive file browser view
                renderExplorer();

            } catch (err) {
                console.error(err);
                statusDisplay.innerText = "Fatal Error: " + err.message;
                logToPanel("[Error] + err.message");
            }
        }
    </script>
</body>
</html>
