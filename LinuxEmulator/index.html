<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Void Linux Emulator</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h2 { margin-bottom: 10px; }
        .control-container { margin-bottom: 20px; text-align: center; }
        button {
            background-color: #d9534f;
            color: #fff;
            border: 1px solid #d43f3a;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 16px;
            border-radius: 4px;
        }
        button:hover { background-color: #c9302c; }
        #screen_container {
            width: 800px;
            height: 600px;
            background-color: #000;
            border: 2px solid #333;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        canvas { display: block; }
        #status-display {
            margin-top: 10px;
            font-size: 16px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <h2>Void Linux Emulator</h2>
    <div class="control-container" id="control_area">
        <div style="margin-bottom: 10px;">
            <button onclick="startLinux('base')" style="background-color: #333; border: 1px solid #555;">Start Base (CLI)</button>
            <button onclick="startLinux('xfce')" style="background-color: #333; border: 1px solid #555;">Start XFCE (GUI)</button>
        </div>
    </div>

    <div id="status-display">Select a version to begin.</div>

    <div id="screen_container">
        <div id="screen"></div>
    </div>

    <script src="libv86.js"></script>
    <script>
        let currentEmulator = null;

        async function startLinux(version) {
            const controlArea = document.getElementById("control_area");
            const statusDisplay = document.getElementById("status-display");
            
            const versionName = version === 'xfce' ? 'XFCE (GUI)' : 'Base (CLI)';
            
            controlArea.innerHTML = `
                <div style="margin-bottom: 10px; font-weight: bold; color: #4CAF50;">
                    Selected: Void Linux ${versionName}
                </div>
                <button onclick="location.reload()">Stop / Reset</button>
            `;

            const isoUrl = (version === 'xfce') 
                ? 'https://huggingface.co/datasets/BasicallyDev/VoidLinuxISOS/resolve/main/void-live-i686-20250202-xfce.iso' 
                : 'https://huggingface.co/datasets/BasicallyDev/VoidLinuxISOS/resolve/main/void-live-i686-20250202-base.iso';

            try {
                statusDisplay.innerText = "Checking ISO file size...";

                const headResponse = await fetch(isoUrl, { method: 'HEAD' });
                const contentLength = headResponse.headers.get('content-length');
                const total = contentLength ? parseInt(contentLength, 10) : 0;

                statusDisplay.innerText = "Initializing asynchronous CD-ROM streaming...";
                await new Promise(r => setTimeout(r, 20));

                currentEmulator = new V86({
                    screen_container: document.getElementById("screen_container"),
                    bios: { url: "bios/seabios.bin" },
                    vga_bios: { url: "bios/vgabios.bin" },
                    cdrom: { 
                        url: isoUrl, 
                        async: true, 
                        size: total 
                    },
                    autostart: true,
                    memory: version === 'xfce' ? 512 * 1024 * 1024 : 256 * 1024 * 1024,
                    vga_memory: 16 * 1024 * 1024,
                    network_relay_url: "wss://relay.widget.v86.wasm.in/",
                    boot_order: 0x3
                });

                statusDisplay.innerText = "Running";
            } catch (err) {
                console.error(err);
                statusDisplay.innerText = "Error loading ISO: " + err.message;
            }
        }
    </script>
</body>
</html>
