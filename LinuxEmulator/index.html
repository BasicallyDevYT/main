<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tiny Core Linux GUI Emulator</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h2 { margin-bottom: 10px; }
        .control-container { margin-bottom: 20px; text-align: center; }
        button {
            background-color: #d9534f;
            color: #fff;
            border: 1px solid #d43f3a;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 16px;
            border-radius: 4px;
        }
        button:hover { background-color: #c9302c; }
        #screen_container {
            width: 800px;
            height: 600px;
            background-color: #000;
            border: 2px solid #333;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        canvas { display: block; }
        #status-display {
            margin-top: 10px;
            font-size: 16px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <h2>Tiny Core Linux GUI Emulator</h2>
    <div class="control-container" id="control_area">
        <div style="margin-bottom: 10px;">
            <button onclick="startTinyCore()" style="background-color: #333; border: 1px solid #555;">Start Tiny Core GUI</button>
        </div>
    </div>

    <div id="status-display">Click to start the graphical environment.</div>

    <div id="screen_container">
        <div id="screen"></div>
    </div>

    <script src="libv86.js"></script>
    <script>
        let currentEmulator = null;

        async function startTinyCore() {
            const controlArea = document.getElementById("control_area");
            const statusDisplay = document.getElementById("status-display");
            
            controlArea.innerHTML = `
                <div style="margin-bottom: 10px; font-weight: bold; color: #4CAF50;">
                    Selected: Tiny Core Linux GUI (ISO Buffer Boot)
                </div>
                <button onclick="location.reload()">Stop / Reset</button>
            `;

            const isoUrl = 'https://huggingface.co/datasets/BasicallyDev/VoidLinuxISOS/resolve/main/TinyCore-current.iso';

            try {
                statusDisplay.innerText = "Downloading ISO into memory buffer...";
                
                const response = await fetch(isoUrl);
                if (!response.ok) throw new Error("Failed to fetch ISO file (HTTP " + response.status + ")");
                const isoArrayBuffer = await response.arrayBuffer();

                statusDisplay.innerText = "Booting Tiny Core ISO...";

                currentEmulator = new V86({
                    screen_container: document.getElementById("screen_container"),
                    bios: { url: "bios/seabios.bin" },
                    vga_bios: { url: "bios/vgabios.bin" },
                    cdrom: { 
                        buffer: isoArrayBuffer 
                    },
                    autostart: true,
                    memory: 128 * 1024 * 1024,
                    vga_memory: 16 * 1024 * 1024,
                    network_relay_url: "wss://relay.widget.v86.wasm.in/",
                    boot_order: 0x2
                });

                statusDisplay.innerText = "Running GUI";
            } catch (err) {
                console.error(err);
                statusDisplay.innerText = "Error loading ISO: " + err.message;
            }
        }
    </script>
</body>
</html>
