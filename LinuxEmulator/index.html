<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Void Linux v86 Emulator</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h2 { margin-bottom: 10px; }
        .button-container { margin-bottom: 20px; }
        button {
            background-color: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 10px 20px;
            margin: 0 5px;
            cursor: pointer;
            font-size: 16px;
            border-radius: 4px;
        }
        button:hover { background-color: #444; }
        #screen_container {
            width: 800px;
            height: 600px;
            background-color: #000;
            border: 2px solid #333;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        canvas {
            display: block;
        }
        #loading {
            margin-top: 10px;
            font-style: italic;
            color: #aaa;
        }
    </style>
</head>
<body>

    <h2>Choose Your Linux Environment</h2>
    <div class="button-container">
        <button onclick="startLinux('base')">Start Base (CLI)</button>
        <button onclick="startLinux('xfce')">Start XFCE (GUI)</button>
    </div>

    <div id="loading"></div>

    <div id="screen_container">
        <div id="screen"></div>
    </div>

    <!-- Include libv86 script -->
    <script src="libv86.js"></script>
    <script>
        let currentEmulator = null;

        async function downloadAndRun(url, memorySize, isCdrom) {
            if (currentEmulator) {
                currentEmulator.stop();
                currentEmulator = null;
            }

            document.getElementById("screen").innerHTML = "";
            const loadingDiv = document.getElementById("loading");
            loadingDiv.innerText = "Downloading OS image... Please wait.";

            try {
                // Fetch the ISO directly as an ArrayBuffer to bypass browser CORS redirection blocks on the raw fetch
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const blob = await response.blob();
                const buffer = await blob.arrayBuffer();

                loadingDiv.innerText = "Booting emulator...";

                const config = {
                    screen_container: document.getElementById("screen_container"),
                    bios: { url: "bios/seabios.bin" },
                    vga_bios: { url: "bios/vgabios.bin" },
                    autostart: true,
                    memory: memorySize,
                    vga_memory: 16 * 1024 * 1024,
                    network_relay_url: "wss://relay.widget.v86.wasm.in/"
                };

                // Pass buffer into cdrom or hda depending on media type
                if (isCdrom) {
                    config.cdrom = { buffer: buffer };
                    config.boot_order = 0x3;
                } else {
                    config.hda = { buffer: buffer };
                }

                currentEmulator = new V86(config);
                loadingDiv.innerText = "";
            } catch (err) {
                console.error(err);
                loadingDiv.innerText = "Failed to download image: " + err.message;
            }
        }

        function startLinux(version) {
            const isXfce = (version === 'xfce');
            const url = isXfce 
                ? 'https://github.com/BasicallyDevYT/main/releases/download/Void/void-live-i686-20250202-xfce.iso' 
                : 'https://github.com/BasicallyDevYT/main/releases/download/Void/void-live-i686-20250202-base.iso';
            
            const memory = isXfce ? 512 * 1024 * 1024 : 256 * 1024 * 1024;

            downloadAndRun(url, memory, true);
        }
    </script>
</body>
</html>
