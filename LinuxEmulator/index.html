<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Void Linux Emulator</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h2 { margin-bottom: 10px; }
        .control-container { margin-bottom: 20px; text-align: center; }
        button {
            background-color: #d9534f;
            color: #fff;
            border: 1px solid #d43f3a;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 16px;
            border-radius: 4px;
        }
        button:hover { background-color: #c9302c; }
        #screen_container {
            width: 800px;
            height: 600px;
            background-color: #000;
            border: 2px solid #333;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        canvas { display: block; }
        #status-display {
            margin-top: 10px;
            font-size: 16px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <h2>Linux - Void Edition</h2>
    <div class="control-container" id="control_area">
        <div style="margin-bottom: 10px;">
            <button onclick="startLinux('base')" style="background-color: #333; border: 1px solid #555;">Start Base (CLI)</button>
            <button onclick="startLinux('xfce')" style="background-color: #333; border: 1px solid #555;">Start XFCE (GUI)</button>
        </div>
    </div>

    <div id="status-display">Select a version to begin.</div>

    <div id="screen_container">
        <div id="screen"></div>
    </div>

    <script src="libv86.js"></script>
    <script>
        let currentEmulator = null;

        async function startLinux(version) {
            const controlArea = document.getElementById("control_area");
            const statusDisplay = document.getElementById("status-display");
            
            const versionName = version === 'xfce' ? 'XFCE (GUI)' : 'Base (CLI)';
            
            controlArea.innerHTML = `
                <div style="margin-bottom: 10px; font-weight: bold; color: #4CAF50;">
                    Selected: Void Linux ${versionName}
                </div>
                <button onclick="location.reload()">Stop / Reset</button>
            `;

            const isoUrl = (version === 'xfce') 
                ? 'https://huggingface.co/datasets/BasicallyDev/VoidLinuxISOS/resolve/main/void-live-i686-20250202-xfce.iso' 
                : 'https://huggingface.co/datasets/BasicallyDev/VoidLinuxISOS/resolve/main/void-live-i686-20250202-base.iso';

            try {
                statusDisplay.innerText = "Connecting to Hugging Face and starting network download... (0.0%)";

                const response = await fetch(isoUrl);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                const contentLength = response.headers.get('content-length');
                const total = contentLength ? parseInt(contentLength, 10) : 0;
                let loaded = 0;

                const reader = response.body.getReader();
                const chunks = [];

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    chunks.push(value);
                    loaded += value.length;
                    
                    if (total > 0) {
                        const percent = ((loaded / total) * 100).toFixed(1);
                        statusDisplay.innerText = `Downloading ISO data streams over network... (${percent}%)`;
                    } else {
                        statusDisplay.innerText = `Downloading ISO data streams over network... (${(loaded / 1024 / 1024).toFixed(1)} MB loaded)`;
                    }
                }

                statusDisplay.innerText = "Combining network chunks into a single binary Blob...";
                // Small yield to let browser paint UI update
                await new Promise(r => setTimeout(r, 20));
                const blob = new Blob(chunks);

                statusDisplay.innerText = "Converting Blob into raw ArrayBuffer for memory mapping...";
                await new Promise(r => setTimeout(r, 20));
                const buffer = await blob.arrayBuffer();

                statusDisplay.innerText = "Allocating virtual machine RAM and loading ISO into virtual CD-ROM memory...";
                await new Promise(r => setTimeout(r, 20));

                currentEmulator = new V86({
                    screen_container: document.getElementById("screen_container"),
                    bios: { url: "bios/seabios.bin" },
                    vga_bios: { url: "bios/vgabios.bin" },
                    cdrom: { buffer: buffer },
                    autostart: true,
                    memory: version === 'xfce' ? 512 * 1024 * 1024 : 256 * 1024 * 1024,
                    vga_memory: 16 * 1024 * 1024,
                    network_relay_url: "wss://relay.widget.v86.wasm.in/",
                    boot_order: 0x3
                });

                statusDisplay.innerText = "Running";
            } catch (err) {
                console.error(err);
                statusDisplay.innerText = "Error loading ISO: " + err.message;
            }
        }
    </script>
</body>
</html>
